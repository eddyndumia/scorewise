<div style="background: var(--surface-1); border-radius: 12px; padding: 1.5rem 1rem; display: flex; justify-content: center;">
  <div style="width: 300px; background: var(--surface-2); border-radius: 20px; border: 0.5px solid var(--border); padding: 1.25rem 1.25rem 1rem; box-shadow: var(--shadow-md);">

    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <div style="width: 22px; height: 22px; border-radius: 6px; background: var(--bg-tint-aqua); display: flex; align-items: center; justify-content: center;">
          <i class="ti ti-chart-bar" style="font-size: 13px; color: var(--text-tint-aqua);" aria-hidden="true"></i>
        </div>
        <span style="font-size: 13px; color: var(--text-secondary);">scorewise</span>
      </div>
      <div style="width: 26px; height: 26px; border-radius: 50%; background: var(--bg-tint-violet); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 500; color: var(--text-tint-violet);">JK</div>
    </div>

    <p style="font-size: 13px; color: var(--text-secondary); margin: 0 0 2px;">Good afternoon, John</p>

    <div style="display: flex; align-items: flex-end; justify-content: space-between; margin: 12px 0 6px;">
      <div>
        <p style="font-size: 12px; color: var(--text-muted); margin: 0 0 4px;">your score</p>
        <p style="font-size: 40px; font-weight: 500; margin: 0; line-height: 1;">684</p>
      </div>
      <div style="display: flex; align-items: center; gap: 4px; background: var(--bg-tint-green); border-radius: var(--radius); padding: 4px 10px; margin-bottom: 6px;">
        <i class="ti ti-trending-up" style="font-size: 12px; color: var(--text-tint-green);" aria-hidden="true"></i>
        <span style="font-size: 11px; color: var(--text-tint-green);">+18 this month</span>
      </div>
    </div>

    <svg viewBox="0 0 280 60" width="100%" height="60" style="margin-bottom: 1rem;">
      <polyline points="0,45 40,42 80,38 120,30 160,28 200,20 240,15 280,10" fill="none" stroke="var(--fill-success)" stroke-width="2"/>
      <circle cx="280" cy="10" r="3.5" fill="var(--fill-success)"/>
    </svg>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; margin-bottom: 1.25rem;">
      <div style="background: var(--surface-1); border-radius: var(--radius); padding: 10px;">
        <p style="font-size: 11px; color: var(--text-secondary); margin: 0 0 3px;">Active requests</p>
        <p style="font-size: 15px; font-weight: 500; margin: 0;">1 SACCO</p>
      </div>
      <div style="background: var(--surface-1); border-radius: var(--radius); padding: 10px;">
        <p style="font-size: 11px; color: var(--text-secondary); margin: 0 0 3px;">Data shared</p>
        <p style="font-size: 15px; font-weight: 500; margin: 0;">Expires 22h</p>
      </div>
    </div>

    <p style="font-size: 12px; color: var(--text-muted); margin: 0 0 8px;">what's shaping this</p>
    <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 1rem;">
      <div>
        <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
          <span style="font-size: 13px;">Repayment history</span>
          <span style="font-size: 12px; font-weight: 500; color: var(--text-success);">strong</span>
        </div>
        <div style="height: 4px; background: var(--surface-1); border-radius: 3px; overflow: hidden;">
          <div style="width: 88%; height: 100%; background: var(--fill-success);"></div>
        </div>
      </div>
      <div>
        <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
          <span style="font-size: 13px;">Fuliza reliance</span>
          <span style="font-size: 12px; font-weight: 500; color: var(--text-warning);">moderate</span>
        </div>
        <div style="height: 4px; background: var(--surface-1); border-radius: 3px; overflow: hidden;">
          <div style="width: 45%; height: 100%; background: var(--fill-warning);"></div>
        </div>
      </div>
      <div>
        <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
          <span style="font-size: 13px;">Savings activity</span>
          <span style="font-size: 12px; font-weight: 500; color: var(--text-success);">strong</span>
        </div>
        <div style="height: 4px; background: var(--surface-1); border-radius: 3px; overflow: hidden;">
          <div style="width: 80%; height: 100%; background: var(--fill-success);"></div>
        </div>
      </div>
    </div>

    <div style="background: var(--surface-1); border-radius: var(--radius); padding: 12px; margin-bottom: 1rem;">
      <p style="font-size: 12px; color: var(--text-secondary); margin: 0; line-height: 1.6;">Fewer Fuliza top-ups in the next 3 months could raise your score by ~20 points.</p>
    </div>

    <div style="display: flex; justify-content: space-around; border-top: 0.5px solid var(--border); padding-top: 10px; margin-top: 4px;">
      <div style="text-align: center;"><i class="ti ti-home" style="font-size: 18px; color: var(--text-accent);" aria-hidden="true"></i></div>
      <div style="text-align: center;"><i class="ti ti-chart-line" style="font-size: 18px; color: var(--text-muted);" aria-hidden="true"></i></div>
      <div style="text-align: center;"><i class="ti ti-share" style="font-size: 18px; color: var(--text-muted);" aria-hidden="true"></i></div>
      <div style="text-align: center;"><i class="ti ti-user" style="font-size: 18px; color: var(--text-muted);" aria-hidden="true"></i></div>
    </div>
  </div>
</div>
